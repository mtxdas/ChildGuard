name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

      - name: Build Web
        run: |
          npm run build || npx next build
          mkdir -p out

      - name: Initialize & Add Android Platform
        run: |
          npx cap init ChildGuard com.childguard.app --web-dir out || true
          npx cap add android || true
          npx cap sync android

      - name: Set Android Properties
        run: |
          cat << 'EOF' >> android/gradle.properties
          android.suppressUnsupportedCompileSdk=36          android.overrideVersionCheck=true
          EOF

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChildGuard-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
