      - name: Install Dependencies & Process Capacitor
        run: |
          if [ -f "package.json" ]; then
            npm install --legacy-peer-deps || npm install
            
            # 1. Build frontend assets (dist/www/build) if build script exists
            npm run build --if-present
            
            # 2. Clean Termux AAPT2 overrides if present
            find . -name "gradle.properties" -not -path "*/node_modules/*" -exec sed -i '/android.aapt2FromMavenOverride/d' {} +
            
            # 3. Copy web assets to Android native platform & sync
            npx cap copy android || true
            npx cap sync android || true
            
            # 4. Ensure capacitor-cordova-android-plugins directory exists
            PLUGINS_DIR="android/capacitor-cordova-android-plugins"
            mkdir -p "$PLUGINS_DIR"
            
            # 5. Create cordova.variables.gradle if missing
            VAR_FILE="$PLUGINS_DIR/cordova.variables.gradle"
            if [ ! -f "$VAR_FILE" ] || [ ! -s "$VAR_FILE" ]; then
              echo "// Auto-generated cordova variables" > "$VAR_FILE"
              echo "ext {" >> "$VAR_FILE"
              echo "}" >> "$VAR_FILE"
            fi

            # 6. Write valid build.gradle with AGP 8+ compliant namespace
            GRADLE_FILE="$PLUGINS_DIR/build.gradle"
            echo "apply plugin: 'com.android.library'" > "$GRADLE_FILE"
            echo "" >> "$GRADLE_FILE"
            echo "android {" >> "$GRADLE_FILE"
            echo "    namespace 'com.capacitor.cordova.plugins'" >> "$GRADLE_FILE"
            echo "    compileSdk 34" >> "$GRADLE_FILE"
            echo "    defaultConfig {" >> "$GRADLE_FILE"
            echo "        minSdk 22" >> "$GRADLE_FILE"
            echo "        targetSdk 34" >> "$GRADLE_FILE"
            echo "    }" >> "$GRADLE_FILE"
            echo "    lintOptions {" >> "$GRADLE_FILE"
            echo "        abortOnError false" >> "$GRADLE_FILE"
            echo "    }" >> "$GRADLE_FILE"
            echo "}" >> "$GRADLE_FILE"
          fi
